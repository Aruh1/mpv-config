# Profiles #

include="~~/profiles.conf"

#-- Video Output -----------------------------------------------#

input-ipc-server=\\.\pipe\mpvsocket
vo=gpu-next
gpu-api=vulkan
gpu-context=auto
profile=high-quality
hwdec=auto
priority=high
gpu-shader-cache-dir="~~/.cache/shaders"

#-- Scaling & Dithering ----------------------------------------#

scale=ewa_lanczossharp
scale-antiring=0.6
cscale=ewa_lanczossharp
dscale=hermite

sigmoid-upscaling=yes
correct-downscaling=yes

dither=fruit
dither-depth=auto
temporal-dither=yes

#-- Deband -----------------------------------------------------#

deband=no
deband-iterations=3
deband-threshold=34
deband-range=16
deband-grain=0

#-- HDR → SDR --------------------------------------------------#

hdr-compute-peak=yes
tone-mapping=reinhard
tone-mapping-param=0.6
target-colorspace-hint=yes
treat-srgb-as-power22=auto

#-- Audio ------------------------------------------------------#

alang=ja,jpn,jp,Japanese,en,eng,English,ind,Indonesia
volume-max=200
audio-file-auto=fuzzy

#-- Subtitles --------------------------------------------------#

slang=en,eng,English,id,Indonesia
sub-auto=fuzzy
sub-fix-timing=yes
blend-subtitles=yes
sub-scale-with-window=yes
sub-ass-scale-with-window=yes
demuxer-mkv-subtitle-preroll=yes

sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles

sub-font='RolandBecker Bold'
sub-font-size=42
sub-scale=1.0
sub-border-size=1.5
sub-color='#FFFFFFFF'
sub-border-color='#FF000000'
sub-shadow-color='#40000000'
sub-shadow-offset=1.0
sub-margin-y=40
sub-blur=0.2

#-- OSD/OSC ----------------------------------------------------#

osc=no
border=no
osd-bar=no
osd-bold=yes
osd-font-size=37
osd-font='Ubuntu Medium'
cursor-autohide=4000

#-- Screenshot -------------------------------------------------#

screenshot-format=png
screenshot-template='%F - [%05n]'

#-- Window -----------------------------------------------------#

title=${media-title} [${time-pos}${!duration==0: / ${duration}}] • ${mpv-version}
fs=no
snap-window
geometry=50%:50%
autofit-larger=80%x80%

#-- yt-dlp -----------------------------------------------------#

[ytdl]
ytdl-format=bestvideo[height<=?720][fps<=?30][vcodec!=?vp9]+bestaudio/best
ytdl-raw-options=sub-lang=en,write-sub=,write-auto-sub=
hls-bitrate=max

#-- Conditional Profiles ---------------------------------------#

[loop-small]
profile-cond=duration <= 90
profile-restore=copy
loop-file=inf

[simulcast]
profile-desc=Enable deband for simulcast releases
profile-cond=(function(a)for b,c in ipairs(a)do if p.filename:match(c)then return true end end end)({"SubsPlease","%-VARYG","SubsPlus%+"})
profile-restore=copy
deband=yes

[cr-tsfix]
profile-desc=CR TS fix
profile-cond=string.match(p.filename, "HorribleSubs")~=nil or string.match(p.filename, "Erai%-raws")~=nil or string.match(p.filename, "-VARYG")~=nil or string.match(p.filename, "-NanDesuKa")~=nil or string.match(p.filename, "SubsPlease")~=nil or string.match(p.filename, "NC%-raws")~=nil
profile-restore=copy
sub-ass-style-overrides=LayoutResX=640,LayoutResY=360

[crunchyroll]
profile-desc=Fix Crunchyroll aspect ratio
profile-cond=p.filename:match("SubsPlease")
profile-restore=copy
sub-ass-use-video-data=aspect-ratio

[auto-blend-subtitles]
profile-desc=Disable blend for SRT subtitles
profile-cond=get("current-tracks/sub/codec"):match("subrip")
profile-restore=copy
blend-subtitles=no

[Webtorrent-entries]
profile-desc=Disable memo for Webtorrent
profile-cond=string.match(string.lower(string.gsub(require "mp.utils".join_path(get("working-directory", ""), get("path", "")), string.gsub(get("filename", ""), "([^%w])", "%%%1").."$", "")), "webtorrent")~=nil
profile-restore=copy-equal
script-opts-append=memo-enabled=no

[benchmark]
profile-desc=Benchmark mode
audio=no
untimed=yes
framedrop=no
video-sync=display-desync
vulkan-swap-mode=immediate
opengl-swapinterval=0
d3d11-sync-interval=0
osd-msg1='fps: ${estimated-display-fps}\nhwdec: ${hwdec-current}\ncache: ${cache-speed}'
