#───────────────────────────────────────────────────────────────────────────────
#  MPV Input Configuration
#───────────────────────────────────────────────────────────────────────────────

#── Playback ───────────────────────────────────────────────────────────────────

SPACE       cycle pause                             # Play/Pause
q           quit                                    # Quit
Q           quit_watch_later                        # Save position & quit
l           cycle-values loop-file "inf" "no"       # Toggle loop

#── Seeking ────────────────────────────────────────────────────────────────────

RIGHT       playlist_next                           # Next in playlist
LEFT        playlist_prev                           # Previous in playlist
UP          add chapter 1                           # Next chapter
DOWN        add chapter -1                          # Previous chapter

0           seek 0  absolute-percent exact          # Seek to 0%
1           seek 10 absolute-percent exact          # Seek to 10%
2           seek 20 absolute-percent exact          # Seek to 20%
3           seek 30 absolute-percent exact          # Seek to 30%
4           seek 40 absolute-percent exact          # Seek to 40%
5           seek 50 absolute-percent exact          # Seek to 50%
6           seek 60 absolute-percent exact          # Seek to 60%
7           seek 70 absolute-percent exact          # Seek to 70%
8           seek 80 absolute-percent exact          # Seek to 80%
9           seek 90 absolute-percent exact          # Seek to 90%

#── Audio ──────────────────────────────────────────────────────────────────────

+           add volume 1                            # Volume up
-           add volume -1                           # Volume down
m           cycle mute                              # Toggle mute
*           add audio-delay 0.1                     # Increase audio delay
/           add audio-delay -0.1                    # Decrease audio delay
F2          cycle audio                             # Cycle audio tracks
F8          cycle audio-pitch-correction            # Toggle pitch correction

#── Subtitles ──────────────────────────────────────────────────────────────────

F1          cycle sub                               # Cycle subtitles
F7          cycle-values sub-ass-override strip no  # Toggle ASS override
.           add sub-delay 0.25                      #! Subtitles > Timing > Delay +250ms
,           set sub-delay 0                         #! Subtitles > Timing > Reset
CTRL+1      apply-profile cr-tsfix                  #! Subtitles > Style > CR TS Fix

#── Video ──────────────────────────────────────────────────────────────────────

F3          cycle keepaspect                        # Toggle aspect ratio
F4          cycle-values panscan 1 0                # Toggle pan scan
F9          cycle-values window-scale 0.5 0.8 1.0   # Cycle window scale
F10         cycle-values video-rotate 90 180 270 0  # Rotate video
F11         vf toggle hqdn3d=2:1:5:4                # Toggle denoise
F12         vf toggle unsharp=3:3:2.0:5:5:0.0       # Toggle sharpen

#── Window ─────────────────────────────────────────────────────────────────────

F5          cycle border                            # Toggle window border
F6          cycle ontop                             # Toggle always on top

#── Screenshot ─────────────────────────────────────────────────────────────────

s           async screenshot                        # Take screenshot
ctrl+alt+s  script-binding screenshot_mosaic/screenshot

#── Mouse ──────────────────────────────────────────────────────────────────────

MOUSE_BTN0_DBL      cycle fullscreen                # Double-click fullscreen
MOUSE_BTN1          ab_loop                         # Middle-click A-B loop
MOUSE_BTN2          script-binding uosc/menu-blurred
MOUSE_BTN3          seek 5 relative                 # Scroll up: +5s
MOUSE_BTN4          seek -5 relative                # Scroll down: -5s
Ctrl+MOUSE_BTN3     seek 1 relative-percent exact   # Ctrl+scroll: +1%
Ctrl+MOUSE_BTN4     seek -1 relative-percent exact  # Ctrl+scroll: -1%
Shift+MOUSE_BTN3    frame_step                      # Shift+scroll: +1 frame
Shift+MOUSE_BTN4    frame_back_step                 # Shift+scroll: -1 frame
MBTN_FORWARD        add speed 0.05                  # Side button: +0.05x
MBTN_BACK           add speed -0.05                 # Side button: -0.05x

#── Scripts ────────────────────────────────────────────────────────────────────

`           script-binding sview/shader-view
p           script-binding webtorrent/toggle-info
b           script-binding uosc/open-file           #! File > Open File
CTRL+0      no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"

